name: API Utils CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m pip install pipenv
          pipenv verify
          pipenv sync --dev
      - name: Test and lint
        run: |
          pipenv run test
          pipenv run lint
      - name: Build and inspect distributions
        run: |
          pipenv run build
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          wheel="api_utils-$version-py3-none-any.whl"
          sdist="api_utils-$version.tar.gz"
          python -m zipfile -l "dist/$wheel" | grep -F 'api_utils/__init__.py'
          tar -tzf "dist/$sdist" | grep -F "api_utils-$version/api_utils/__init__.py"
          unzip -p "dist/$wheel" "api_utils-$version.dist-info/METADATA" | grep -Fx "Version: $version"
          tar -xOzf "dist/$sdist" "api_utils-$version/PKG-INFO" | grep -Fx "Version: $version"
          cd dist
          sha256sum "$wheel" "$sdist" > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: api-utils-distributions
          path: dist/
          if-no-files-found: error
