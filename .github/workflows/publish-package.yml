name: Publish Package

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: api-utils-distributions
          path: dist
      - name: Verify and publish the tested assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag must match the package version v$version." >&2
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main
          test "$(gh repo view "$REPOSITORY" --json visibility --jq .visibility)" = PUBLIC
          existing=$(gh api --paginate "repos/$REPOSITORY/releases" --jq '.[] | .tag_name')
          if grep -Fxq -- "$GITHUB_REF_NAME" <<< "$existing"; then
            echo "Release $GITHUB_REF_NAME already exists." >&2
            exit 1
          fi
          cd dist
          wheel="api_utils-$version-py3-none-any.whl"
          sdist="api_utils-$version.tar.gz"
          sha256sum "$wheel" "$sdist" | diff - SHA256SUMS
          gh release create "$GITHUB_REF_NAME" "$wheel" "$sdist" SHA256SUMS \
            --repo "$REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
