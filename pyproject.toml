# Python package metadata for api_utils (pip install name: api-utils).
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "api_utils"
version = "1.0.1"
description = "A utility package for Mentor Hub microservices"
authors = [{name = "Mike Storey", email = "devs@agile-learning.institute"}]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask",
    "pymongo",
    "prometheus-flask-exporter",
]

[project.optional-dependencies]
dev = ["black", "pytest", "unittest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["api_utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
# Test tiers (see Pipfile [scripts]):
#   pipenv run test        -> pure unit tests (mocked; no backing services)
#   pipenv run integration -> integration tests against the backing DB (pipenv run db)
#   pipenv run e2e         -> end-to-end tests against a running dev server
norecursedirs = []
markers = [
    "e2e: marks tests as end-to-end tests (deselect with '-m \"not e2e\"')",
    "integration: marks tests that require the backing MongoDB (deselect with '-m \"not integration\"')",
]