  /api/event:
    get:
      tags:
        - Event
      summary: List Event documents
      description: |
        Retrieve a paginated array of Event documents.

        Pagination uses request headers `offset` and `size`. Optional query `profile_id` narrows scope.
        Optional filters and `sort_by` / `order` params apply.
      operationId: getEvents
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/offsetHeader'
        - $ref: '#/components/parameters/sizeHeader'
        - $ref: '#/components/parameters/sortByQuery'
        - $ref: '#/components/parameters/orderQuery'
        - name: profile_id
          in: query
          required: false
          description: Optional profile ID to narrow the event list
          schema:
            type: string
            example: 507f1f77bcf86cd799439011
      responses:
        '200':
          description: Paginated Event documents
          content:
