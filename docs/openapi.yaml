components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT authentication. Tokens must be issued by your identity provider and match
        configured issuer, audience, and signing secret.

  parameters:
    offsetHeader:
      name: offset
      in: header
      required: false
      description: Zero-based index of the first document to return (default 0)
      schema:
        type: integer
        minimum: 0
        default: 0
        example: 0
    sizeHeader:
      name: size
      in: header
      required: false
      description: Number of documents to return (default 20, max 100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        example: 20
    sortByQuery:
      name: sort_by
      in: query
      required: false
      description: Whitelisted field to sort by (service-specific)
      schema:
        type: string
        example: name
    orderQuery:
      name: order
      in: query
      required: false
      description: Sort order
      schema:
        type: string
        enum: [asc, desc]
        default: asc
        example: asc
    resourceIdPath:
      name: resource_id
      in: path
      required: true
      description: Resource ID (MongoDB ObjectId)
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
        example: 507f1f77bcf86cd799439011
    pathIdPath:
      name: path_id
      in: path
      required: true
      description: Path ID (MongoDB ObjectId)
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
        example: 507f1f77bcf86cd799439011
    planIdPath:
      name: plan_id
      in: path
      required: true
      description: Plan ID (MongoDB ObjectId)
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
        example: 507f1f77bcf86cd799439011
    profileIdPath:
      name: profile_id
      in: path
      required: true
      description: Profile ID (MongoDB ObjectId)
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
        example: 507f1f77bcf86cd799439011
    journeyIdPath:
      name: journey_id
      in: path
      required: true
      description: Journey ID (MongoDB ObjectId)
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
        example: 507f1f77bcf86cd799439011
    encounterIdPath:
      name: encounter_id
      in: path
      required: true
      description: Encounter ID (MongoDB ObjectId)
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
        example: 507f1f77bcf86cd799439011
    eventIdPath:
      name: event_id
      in: path
      required: true
      description: External Event ID (MongoDB ObjectId)
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
        example: 507f1f77bcf86cd799439011

  responses:
    Unauthorized:
      description: Unauthorized - missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Document not found or not visible to caller
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    DocumentObject:
      type: object
      description: Generic MongoDB document (demo server uses shared service shapes)
      additionalProperties: true
    DocumentArray:
      type: array
      description: Paginated page of MongoDB documents
      items:
        $ref: '#/components/schemas/DocumentObject'

    ConfigResponse:
      type: object
      required:
        - config_items
        - versions
        - enumerators
        - token
      properties:
        config_items:
          type: array
          description: List of configuration items with their sources
          items:
            $ref: '#/components/schemas/ConfigItem'
        versions:
          type: array
          description: Collection version information from MongoDB
          items:
            type: object
        enumerators:
          type: array
          description: Database enumerator documents from MongoDB
          items:
            type: object
        token:
          type: object
          description: Authenticated user token information
          properties:
            user_id:
              type: string
              example: "test-user-123"
            roles:
              type: array
              items:
                type: string
              example: ["developer"]
            remote_ip:
              type: string
              example: "127.0.0.1"
    
    ConfigItem:
      type: object
      required:
        - name
        - value
        - from
      properties:
        name:
          type: string
          description: Configuration key name
          example: "MONGO_DB_NAME"
        value:
          type: string
          description: Configuration value (secrets are masked as "secret")
          example: "engagement"
        from:
          type: string
          enum: [file, environment, default]
          description: Source of the configuration value
          example: "environment"
    
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message
          example: "Missing or invalid Authorization header"
        details:
          type: string
          description: Additional error details (optional)