openapi: 3.0.3
info:
  title: api_utils Demo Server
  description: |
    Demonstration server for the api_utils Python package.
    
    This server showcases the utilities provided by api_utils:
    - Config singleton for configuration management
    - MongoIO singleton for MongoDB operations
    - Flask routes for config endpoint
    - JWT authentication and token validation
    - Prometheus metrics endpoint
    
    JWTs are issued by your identity provider (or the Developer Edition welcome flow), not by
    this demo server. This OpenAPI documents the **library demo server** (`/api/config`, `/metrics`,
    `/docs`).
    
    ## Authentication
    
    Protected endpoints require a Bearer JWT that validates against `JWT_SECRET`, `JWT_ISSUER`,
    and `JWT_AUDIENCE`. For local black-box tests, use a token signed with the same secret as
    `pipenv run dev` (see repository `tests/e2e_auth.py`).
    
    ```bash
    curl -H "Authorization: Bearer $TOKEN" http://localhost:8385/api/config
    ```
    
    ## Security Requirements
    
    **CRITICAL:** `JWT_SECRET` must be explicitly set before using api_utils.
    The application will fail to start if `JWT_SECRET` is not configured.
    
    See the [SECURITY.md](https://github.com/mentor-hub-system/mentorhub_api_utils/blob/main/SECURITY.md) 
    for complete security documentation.
    
  version: 1.0.0
  contact:
    name: Agile Learning Institute
    url: https://github.com/mentor-hub-system/mentorhub_api_utils
  license:
    name: MIT

servers:
  - url: http://localhost:8385
    description: Local development server (default)

tags:
  - name: Configuration
    description: Runtime configuration endpoints
  - name: Monitoring
    description: Prometheus metrics and health endpoints
  - name: Documentation
    description: Static API documentation files
  - name: Resource
    description: Resource consume GET endpoints
  - name: Path
    description: Path consume GET endpoints
  - name: Plan
    description: Plan consume GET endpoints
  - name: Profile
    description: Profile consume GET endpoints
  - name: Notification
    description: Notification consume GET endpoints
  - name: Event
    description: Event consume GET endpoints
  - name: Note
    description: Note consume GET endpoints
  - name: Journey
    description: Journey consume GET endpoints
  - name: Encounter
    description: Encounter consume GET endpoints
  - name: Mentee
    description: Mentee consume GET endpoints
  - name: Aggregation
    description: Aggregation consume GET endpoints
  - name: External Event
    description: External Event consume GET endpoints

paths:
  /api/config:
    get:
      tags:
        - Configuration
      summary: Get runtime configuration
      description: |
        Retrieve the current runtime configuration including:
        - Configuration items with their sources (file, environment, default)
        - Database enumerators
        - Collection versions
        - Token information
        
        Secret values are masked in the response.
      operationId: getConfig
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Configuration retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        '401':
          description: Unauthorized - missing or invalid authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-code-samples:
        - lang: curl
          source: |
            curl -X GET "http://localhost:8385/api/config" \
              -H "Authorization: Bearer $TOKEN"

  /metrics:
    get:
      tags:
        - Monitoring
      summary: Prometheus metrics endpoint
      description: |
        Metrics in Prometheus text exposition format.
        
        This endpoint is automatically exposed by the `create_metric_routes()` function
        and provides metrics about:
        - HTTP request counts and durations
        - Response status codes
        - Active requests
        
        No authentication required.
      operationId: getMetrics
      responses:
        '200':
          description: Prometheus metrics in text format
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # HELP flask_http_request_duration_seconds Flask HTTP request duration in seconds
                  # TYPE flask_http_request_duration_seconds histogram
                  flask_http_request_duration_seconds_bucket{le="0.005",method="GET",path="/api/config",status="200"} 1.0
      x-code-samples:
        - lang: curl
          source: |
            curl -X GET "http://localhost:8385/metrics"

  /docs/{filename}:
    get:
      tags:
        - Documentation
      summary: Serve API documentation files
      description: |
        Serve static files from the docs directory including:
        - explorer.html - Interactive API explorer (Swagger UI)
        - openapi.yaml - OpenAPI specification
      operationId: getDocs
      parameters:
        - name: filename
          in: path
          required: true
          description: Documentation filename
          schema:
            type: string
            example: explorer.html
      responses:
        '200':
          description: Documentation file served successfully
          content:
            text/html:
              schema:
                type: string
            text/yaml:
              schema:
                type: string
        '404':
          description: File not found
      x-code-samples:
        - lang: curl
          source: |
            # Access the API explorer
            curl -X GET "http://localhost:8385/docs/explorer.html"

  /api/resource:
    get:
      tags:
        - Resource
      summary: List Resource documents
      description: |
        Retrieve a paginated array of Resource documents.

        Pagination uses request headers `offset` (default `0`) and `size` (default `20`, max `100`).
        Optional query filters and `sort_by` / `order` params are whitelisted per service list spec.
      operationId: getResources
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/offsetHeader'
        - $ref: '#/components/parameters/sizeHeader'
        - $ref: '#/components/parameters/sortByQuery'
        - $ref: '#/components/parameters/orderQuery'
      responses:
        '200':
          description: Paginated Resource documents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentArray'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/resource/{resource_id}:
    get:
      tags:
        - Resource
      summary: Get Resource by ID
      operationId: getResource
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/resourceIdPath'
      responses:
        '200':
          description: Resource document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/path:
    get:
      tags:
        - Path
      summary: List Path documents
