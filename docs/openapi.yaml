      summary: List Notes for a Resource
      description: |
        Retrieve a paginated array of Note documents scoped to a Resource.

        Requires query parameter `resource_id`. Pagination uses request headers `offset` and `size`.
      operationId: getNotes
      security:
        - bearerAuth: []
      parameters:
        - name: resource_id
          in: query
          required: true
          description: Resource ID whose notes to list
          schema:
            type: string
            example: 507f1f77bcf86cd799439011
